# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng "(ví dụ)" bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số học sinh THPT dùng gia sư nếu đưa vào dùng — 3 kịch bản
  low: 300
  base: 1000
  high: 3000
  source: "(tự ước tính) Cơ sở 1.000 = thí điểm 1 trường THPT, khớp spec.md §2; thấp 300 = một khối lớp của trường đó; cao 3.000 = 3 trường. Chưa có số công khai có link — cần thay nếu nhóm tìm được"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1. 1 phiên = 1 lần em bí bài và mở gia sư
                    # Nguồn: khảo sát câu 5 "Trong 1 tuần qua, em dùng app giải bài / chatbot cho bài tập về nhà khoảng mấy lần?"
                    # (evidence/survey/results.csv, n = 22 lúc 18:09 27/11)
                    # Giả định (tự ước tính): em dùng gia sư thay cho app / chatbot với cùng tần suất; 1 tháng = 4 tuần
  - name: it_hoi
    share: 0.32             # 7/22 em chọn 0 hoặc 1–2 lần / tuần
    uses_per_month: 3       # trung bình nhóm ≈ 0,86 lần / tuần (3 em × 0, 4 em × 1,5) × 4
    turns_per_session: 2    # (tự ước tính) gửi bước làm → nhận gợi ý → hỏi lại 1 lần
    source: "khảo sát câu 5: 7/22 chọn 0 hoặc 1–2 lần / tuần (điểm giữa 0 và 1,5) × 4 tuần; số lượt / phiên (tự ước tính)"
  - name: hoi_vua
    share: 0.27             # 6/22 em chọn 3–5 hoặc 6–10 lần / tuần
    uses_per_month: 29      # trung bình nhóm ≈ 7,3 lần / tuần (1 em × 4, 5 em × 8) × 4
    turns_per_session: 3    # (tự ước tính)
    source: "khảo sát câu 5: 6/22 chọn 3–5 hoặc 6–10 lần / tuần (điểm giữa 4 và 8) × 4 tuần; số lượt / phiên (tự ước tính)"
  - name: hoi_nhieu
    share: 0.41             # 9/22 em chọn Trên 10 lần / tuần
    uses_per_month: 48      # 12 lần / tuần × 4 — khoảng "Trên 10" không có cận trên, lấy 12 (tự ước tính)
    turns_per_session: 4    # (tự ước tính)
    source: "khảo sát câu 5: 9/22 chọn Trên 10 lần / tuần (lấy 12, tự ước tính) × 4 tuần; số lượt / phiên (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "(ví dụ) https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "(ví dụ) https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
